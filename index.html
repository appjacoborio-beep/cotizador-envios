<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotizador Rápido de Envíos - Pastelería Jacobo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { background: #ffffff; width: 100%; max-width: 580px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 20px; }
    h1 { font-size: 1.35rem; margin: 0 0 16px 0; text-align: center; color: #0f172a; }
    .filtros { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 16px; }
    label { font-size: 0.85rem; font-weight: 600; color: #475569; margin-bottom: 4px; display: block; }
    select, input { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; }
    select:focus, input:focus { border-color: #2563eb; }
    .contador { font-size: 0.8rem; color: #64748b; margin-bottom: 10px; text-align: right; }
    .lista { display: flex; flex-direction: column; gap: 8px; max-height: 480px; overflow-y: auto; padding-right: 4px; }
    .card-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    .card-item:hover { background: #f1f5f9; }
    .info-zona { display: flex; flex-direction: column; gap: 3px; }
    .nombre-zona { font-weight: 600; color: #1e293b; font-size: 0.95rem; }
    .tag-sucursal { font-size: 0.75rem; font-weight: 600; padding: 2px 7px; border-radius: 4px; display: inline-block; width: fit-content; }
    .tag-rio { background: #e0f2fe; color: #0369a1; }
    .tag-otay { background: #fef3c7; color: #b45309; }
    .tag-monarca { background: #f3e8ff; color: #7e22ce; }
    .tag-todas { background: #dcfce7; color: #15803d; }
    .precio-val { font-size: 1.15rem; font-weight: 700; color: #0f172a; white-space: nowrap; }
    .precio-gratis { color: #16a34a; }
    .sin-datos { text-align: center; color: #94a3b8; padding: 30px 10px; font-size: 0.95rem; }
  </style>
</head>
<body>

<div class="container">
  <h1>🍰 Cotizador de Envíos</h1>

  <div class="filtros">
    <div>
      <label for="filtroSucursal">Filtrar por Sucursal:</label>
      <select id="filtroSucursal" onchange="filtrar()">
        <option value="todas">Todas las sucursales</option>
        <option value="rio">Sucursal Río</option>
        <option value="otay">Sucursal Otay</option>
        <option value="monarca">Sucursal Monarca</option>
        <option value="foraneas">Foráneas (Rosarito / Tecate / Ensenada)</option>
      </select>
    </div>

    <div>
      <label for="busqueda">Buscar colonia, parque industrial o plaza:</label>
      <input type="text" id="busqueda" placeholder="Ej. Landmark, New City, Soler, UABC..." oninput="filtrar()" autofocus>
    </div>
  </div>

  <div id="contador" class="contador"></div>
  <div id="lista" class="lista"></div>
</div>

function filtrar() {
  const query = document.getElementById('busqueda').value.toLowerCase().trim();
  const sucSeleccionada = document.getElementById('filtroSucursal').value;
  const contenedor = document.getElementById('lista');
  const contador = document.getElementById('contador');

  const normalizar = (txt) => txt.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const busquedaNorm = normalizar(query);

  const resultados = baseDatos.filter(item => {
    const coincideSuc = (sucSeleccionada === 'todas') || 
                        (sucSeleccionada === 'foraneas' && item.suc === 'foraneas') ||
                        (item.suc === sucSeleccionada) ||
                        (item.suc === 'foraneas');

    const coincideTexto = normalizar(item.zona).includes(busquedaNorm) || 
                          normalizar(item.nombreSuc).includes(busquedaNorm);

    return coincideSuc && coincideTexto;
  });

  contador.innerText = `${resultados.length} ubicaciones encontradas`;

  if (resultados.length === 0) {
    contenedor.innerHTML = `
      <div class="sin-datos">
        No se encontró la colonia o empresa.<br>
        <strong>Sugerencia:</strong> Cotiza con gerencia o calcula km adicionales.
      </div>`;
    return;
  }

  let html = '';
  resultados.forEach(item => {
    const precioFmt = item.precio === 0 ? "GRATIS" : `$${item.precio.toLocaleString('es-MX')} MXN`;
    const gratisClass = item.precio === 0 ? "precio-gratis" : "";
    html += `
      <div class="card-item">
        <div class="info-zona">
          <span class="nombre-zona">${item.zona}</span>
          <span class="tag-sucursal ${item.tagClass}">${item.nombreSuc}</span>
        </div>
        <div class="precio-val ${gratisClass}">${precioFmt}</div>
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

// Iniciar al cargar
filtrar();
