function filtrar() {
  const query = document.getElementById('busqueda').value.trim();
  const sucSeleccionada = document.getElementById('filtroSucursal').value;
  const contenedor = document.getElementById('lista');
  const contador = document.getElementById('contador');

  const normalizar = (txt) => txt.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  
  // Separamos lo que escribe el usuario por palabras (ej: "plaza landmark" -> ["plaza", "landmark"])
  const palabrasBusqueda = normalizar(query).split(/\s+/).filter(palabra => palabra.length > 0);

  const resultados = baseDatos.filter(item => {
    // 1. Filtro por sucursal
    const coincideSuc = (sucSeleccionada === 'todas') || 
                        (sucSeleccionada === 'foraneas' && item.suc === 'foraneas') ||
                        (item.suc === sucSeleccionada) ||
                        (item.suc === 'foraneas');

    if (!coincideSuc) return false;
    if (palabrasBusqueda.length === 0) return true;

    // 2. Unimos todo el texto indexable (nombre visible + tags de palabras clave + nombre sucursal)
    const bolsaPalabras = normalizar(item.zona + " " + (item.tags ? item.tags.join(" ") : "") + " " + item.nombreSuc);

    // 3. Algoritmo inteligente: TODAS las palabras escritas deben existir en la bolsa de palabras del registro
    return palabrasBusqueda.every(palabra => bolsaPalabras.includes(palabra));
  });

  contador.innerText = `${resultados.length} ubicaciones encontradas`;

  if (resultados.length === 0) {
    contenedor.innerHTML = `
      <div class="sin-datos">
        No se encontró ninguna zona o empresa con esas palabras.<br>
        <strong>Sugerencia:</strong> Prueba escribiendo solo una palabra clave o cotiza con gerencia.
      </div>`;
    return;
  }

  let html = '';
  resultados.forEach(item => {
    const precioFmt = item.precio === 0 ? "GRATIS" : `$${item.precio.toLocaleString('es-MX')} MXN`;
    const gratisClass = item.precio === 0 ? "precio-gratis" : "";
    const textoRecomendacion = item.suc === "foraneas" ? "Ruta foránea:" : "📍 Enviar desde:";

    html += `
      <div class="card-item">
        <div class="info-zona">
          <span class="nombre-zona">${item.zona}</span>
          <div class="sugerencia-envio">
            <span>${textoRecomendacion}</span>
            <span class="tag-sucursal ${item.tagClass}">${item.nombreSuc}</span>
          </div>
        </div>
        <div class="precio-val ${gratisClass}">${precioFmt}</div>
      </div>
    `;
  });

  contenedor.innerHTML = html;
}

// Iniciar al cargar
filtrar();
</script>
